name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs for the same branch/PR instead of queueing them.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; docker-build/deploy widen only what GHCR needs.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Lint only needs ruff itself — skip flask/gunicorn/pytest here.
      - run: pip install ruff==0.16.10
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --cov=src --cov-report=term-missing

  docker-build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push to GHCR on main pushes; build-only on PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pushed image and smoke test /health
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          response="$(curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://localhost:8000/health)"
          echo "Health check response: $response"
          echo "$response" | grep -q '"status":"ok"'
          docker rm -f smoke
      - name: Deploy
        run: |
          echo "The sha-tagged image is built, pushed to GHCR, and verified."
          echo "Deploy step placeholder — wire up SSH/cloud deploy here, pulling"
          echo "the same sha-tagged image and storing credentials as secrets."
